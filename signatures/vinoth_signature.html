    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .signature-container {
            max-width: 780px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }
        
        .signature-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        
        .signature-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .logo-cell {
            width: 180px;
            padding-right: 30px;
            vertical-align: middle;
            border-right: 2px solid #e0e0e0;
        }
        
        .logo-wrapper {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        
        .signature-container:hover .logo-wrapper {
            transform: scale(1.05);
        }
        
        .logo-img {
            width: 160px;
            height: auto;
            display: block;
        }
        
        .info-cell {
            padding: 0 30px;
            vertical-align: middle;
            width: 320px;
        }
        
        .contact-cell {
            padding-left: 30px;
            vertical-align: middle;
            border-left: 2px solid #e0e0e0;
            width: 280px;
        }
        
        .name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }
        
        .name::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #c9a959, #e6d5a8);
            transition: width 0.4s ease;
        }
        
        .signature-container:hover .name::after {
            width: 100%;
        }
        
        .designation {
            font-size: 14px;
            color: #666;
            margin-bottom: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        .website {
            font-size: 13px;
            margin-bottom: 12px;
        }
        
        .website a {
            color: #c9a959;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .website a:hover {
            color: #a88a3f;
            text-decoration: underline;
        }
        
        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 13px;
            color: #444;
            line-height: 1.6;
        }
        
        .contact-item:last-of-type {
            margin-bottom: 0;
        }
        
        .contact-icon {
            width: 16px;
            height: 16px;
            min-width: 16px;
            margin-right: 10px;
            flex-shrink: 0;
            opacity: 0.7;
            margin-top: 3px;
        }
        
        .contact-item a,
        .contact-item span {
            color: #444;
            text-decoration: none;
            transition: color 0.3s ease;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .contact-item a:hover {
            color: #c9a959;
        }
        
        .social-links {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }
        
        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        
        .social-icon:hover {
            transform: scale(1.15);
            background: #c9a959;
            box-shadow: 0 4px 12px rgba(201, 169, 89, 0.3);
        }
        
        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: #666;
            transition: fill 0.3s ease;
        }
        
        .social-icon:hover svg {
            fill: #ffffff;
        }
        
        @media (max-width: 750px) {
            .signature-container {
                padding: 25px 20px;
            }
            
            .signature-table {
                display: block;
            }
            
            .logo-cell,
            .info-cell,
            .contact-cell {
                display: block;
                width: 100% !important;
                padding: 15px 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .logo-cell {
                text-align: center;
                padding-bottom: 20px;
            }
            
            .info-cell {
                padding-top: 20px;
                padding-bottom: 20px;
            }
            
            .contact-cell {
                border-bottom: none;
                padding-top: 20px;
            }
            
            .name {
                white-space: normal;
            }
        }
    </style>
</head>
